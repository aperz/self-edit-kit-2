# A preview of every pull request (each editor save is one) at
#   https://aperz.github.io/self-edit-kit-2/pr-preview/pr-<number>/
# PROTECTED file.
#
# Mechanism:
# 1. Build with the same checks as the live site. If they fail there is no
#    preview: the editor already refuses most bad content, and checks.yml
#    reports the reason on the pull request.
# 2. Mark every preview page noindex, so search engines never list a draft.
# 3. pr-preview-action commits public/ into gh-pages under pr-preview/pr-N/
#    and removes it again when the pull request is closed or merged.
# 4. Post a commit status "preview" with the address on the pull request's
#    head commit. That is where the editor (Sveltia, backend.preview_context
#    "preview") looks for the preview link; it needs the GitHub App to have
#    "Commit statuses: read".
name: preview
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
permissions:
  contents: write       # commits the preview into gh-pages
  pull-requests: write  # the action's comment with the link
  statuses: write       # the "preview" commit status the editor reads
concurrency:
  # Shared with pages.yml: both push to gh-pages, one at a time.
  group: gh-pages
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: github.event.action != 'closed'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - if: github.event.action != 'closed'
        run: npm ci
      - if: github.event.action != 'closed'
        run: python3 checks/validate_content.py && npx --no @11ty/eleventy && python3 checks/check_site.py
      - if: github.event.action != 'closed'
        name: Mark preview pages noindex
        run: find public -name '*.html' -exec sed -i 's#<head>#<head><meta name="robots" content="noindex">#' {} +
      - id: preview
        uses: rossjrw/pr-preview-action@v1.8.2
        with:
          source-dir: public
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
          # The default QR code is generated by an outside service that would
          # receive every preview address. Not needed; the link is enough.
          qr-code: false
      - if: steps.preview.outputs.deployment-action == 'deploy'
        name: Report the preview to the editor
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.preview.outputs.preview-url }}
        run: >
          gh api -X POST "repos/${{ github.repository }}/statuses/$SHA"
          -f state=success -f context=preview -f target_url="$URL"
          -f description="Podgląd zmiany"
